# name: pinned explicitly (rather than left to default to the checkout
# directory name, which can vary across clones/CI checkouts) so this
# project's containers and volumes stay identifiable and consistent
# regardless of what the checkout folder happens to be named.
name: personal-finance-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: personal_finance_platform
      POSTGRES_PASSWORD: personal_finance_platform
      POSTGRES_DB: personal_finance_platform
    ports:
      - "5433:5432"
    volumes:
      - personal_finance_platform_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_finance_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates every topic in meridian_events.Topics up front so
  # core-api and (from Phase 8+) the consumer services never race a
  # first-ever produce/consume against a topic that doesn't exist yet.
  # Treats "already exists" as success so this is safe to re-run.
  # NOTE: this list is hand-kept in sync with Topics.all() in
  # libs/events/meridian_events/topics.py — there's no way to import
  # Python into a shell command here, so a topic added there needs the
  # same name added to this list by hand.
  redpanda-topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >
        rpk topic create transactions.ingested transactions.enriched alerts.raised insights.generated
        --brokers redpanda:9092 --partitions 3 --replicas 1 || true

  core-api:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://personal_finance_platform:personal_finance_platform@postgres:5432/personal_finance_platform
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/core-api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully

  enrichment-service:
    build:
      context: .
      dockerfile: services/enrichment-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://personal_finance_platform:personal_finance_platform@postgres:5432/personal_finance_platform
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ENVIRONMENT: development
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully

  anomaly-service:
    build:
      context: .
      dockerfile: services/anomaly-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://personal_finance_platform:personal_finance_platform@postgres:5432/personal_finance_platform
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      redis:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully

  # Scheduled poller, not a Kafka consumer — no depends_on redpanda-topics
  # the way the other three services have, since it doesn't touch Kafka
  # at all (see docs/adr/0014-market-data-service-no-kafka-topic.md).
  market-data-service:
    build:
      context: .
      dockerfile: services/market-data-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://personal_finance_platform:personal_finance_platform@postgres:5432/personal_finance_platform
      ENVIRONMENT: development
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      MARKET_DATA_BASE_URL: https://api.twelvedata.com
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      postgres:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
    ports:
      - "3200:3200" # query API
      - "4318:4318" # OTLP/http — also reachable from a host-run (non-Docker) service

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    # No host port published — reached only via the compose network
    # (Promtail's client, Grafana's proxied datasource).

  promtail:
    image: grafana/promtail:3.3.2
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      # Anonymous admin access — acceptable for a local-only dev stack,
      # not a setting to carry into anything shared; see docs/phase12.md.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  personal_finance_platform_pg_data:
