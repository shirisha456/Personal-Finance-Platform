# Production compose for the single-EC2 deployment path
# (infra/terraform/envs/single-ec2). Differences from the root
# docker-compose.yml (that one's for local dev):
#
#   - No source bind-mounts, no --reload, no dev servers.
#   - Only nginx publishes host ports (80/443) — everything else is
#     internal-network-only, not directly reachable from the internet.
#   - Explicit memory/cpu limits on every service, sized from real
#     `docker stats` measurements — see
#     docs/adr/0012-single-ec2-instance-sizing.md.
#   - Named volumes for both postgres and redpanda (the dev compose only
#     names postgres's — fine for throwaway local state, not for a box
#     you actually intend to keep running).
#   - Builds images from source (`docker compose -f deploy/docker-compose.prod.yml
#     up -d --build`), not pulling from a registry — this project has no
#     CI image-publish step (see docs/phase14.md for that scope boundary).
#   - Grafana's anonymous admin access is OFF here (it's convenience-only
#     in dev — see docs/phase12.md); a real admin password is required.
#
# Secrets come from /opt/personal-finance-platform/secrets.env (see secrets.env.example),
# created by hand on the host, never committed, never in Terraform
# state. DATABASE_URL is stored there as one complete pre-assembled
# connection string rather than built from a separate POSTGRES_PASSWORD
# var: compose's ${VAR} interpolation only reads a .env in the invocation
# directory, while env_file: only injects into the *container's* runtime
# environment — two mechanisms that don't share values, so storing the
# full URL once sidesteps needing both.

name: personal-finance-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file: [/opt/personal-finance-platform/secrets.env]
    environment:
      POSTGRES_USER: personal_finance_platform
      POSTGRES_DB: personal_finance_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_finance_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    logging: *default-logging
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  redpanda-topics:
    image: redpandadata/redpanda:v24.2.7
    logging: *default-logging
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >
        rpk topic create transactions.ingested transactions.enriched alerts.raised insights.generated
        --brokers redpanda:9092 --partitions 3 --replicas 1 || true

  core-api:
    build:
      context: ..
      dockerfile: apps/core-api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: [/opt/personal-finance-platform/secrets.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      # No NEXT_PUBLIC_API_URL build arg — nginx proxies the API on the
      # same origin as the frontend, so the browser derives it at
      # runtime (web/src/lib/resolve-api-url.ts). Nothing to rebuild if
      # the domain ever changes.
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - core-api
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"

  enrichment-service:
    build:
      context: ..
      dockerfile: services/enrichment-service/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s # let an in-flight message finish and commit its offset before SIGKILL
    logging: *default-logging
    env_file: [/opt/personal-finance-platform/secrets.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"

  anomaly-service:
    build:
      context: ..
      dockerfile: services/anomaly-service/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    env_file: [/opt/personal-finance-platform/secrets.env]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      redis:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.3"

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ../observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    logging: *default-logging
    env_file: [/opt/personal-finance-platform/secrets.env] # GF_SECURITY_ADMIN_PASSWORD
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - web
      - core-api
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.2"

volumes:
  postgres_data:
  redpanda_data:
  tempo_data:
  prometheus_data:
  loki_data:
  grafana_data:
  certbot_www:
  certbot_certs:
