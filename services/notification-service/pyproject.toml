[project]
name = "personal-finance-platform-notification-service"
version = "0.1.0"
description = "Personal Finance Platform notification-service — fans out Kafka alerts/insights to per-user Redis pub/sub channels"
requires-python = ">=3.12"
# meridian-events (libs/events) is installed as a separate step — see
# docs/phase7.md.
dependencies = [
    "aiokafka>=0.11",
    "redis>=5.1",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
