[project]
name = "personal-finance-platform-core-api"
version = "0.1.0"
description = "Personal Finance Platform core API — FastAPI backend"
requires-python = ">=3.12"
# meridian-events (libs/events) is NOT listed here — a relative sibling
# path isn't a reliable PEP 508 dependency string across pip versions.
# Install it as a separate step instead: `pip install -e ../../libs/events`
# before this package (see README "Local development setup" and
# .github/workflows/ci.yml). This is the accepted cost of a plain-pip
# monorepo without a workspace tool (uv/pdm) — see docs/phase7.md.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "redis>=5.1",
    "httpx>=0.27",
    "cryptography>=43.0",
    "aiokafka>=0.11",
    "openai>=1.50",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "fakeredis>=2.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic-generated migration files follow Alembic's own template, not this
# project's style — not worth hand-editing generated code to satisfy a linter.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in an argument default is the framework's
# own idiomatic pattern, not the mutable-default-argument bug this rule
# exists to catch.
ignore = ["B008"]
